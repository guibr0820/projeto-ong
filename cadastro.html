<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - ONG Esperança</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>ONG Esperança</h1>

        <button
            class="menu-toggle"
            type="button"
            aria-label="Abrir menu de navegação"
            aria-expanded="false">
            ☰
        </button>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="index.html#contato">Contato</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Formulário de Cadastro</h2>

            <p>
                Preencha seus dados para participar das ações da ONG Esperança.
            </p>

            <form>

                <fieldset>
                    <legend>Informações Pessoais</legend>

                    <label for="nome">
                        Nome completo:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                    <label for="nascimento">
                        Data de nascimento:
                    </label>

                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                    >

                    <label for="cpf">
                        CPF:
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        placeholder="000.000.000-00"
                        title="Formato: 000.000.000-00"
                        required
                    >

                    <label for="telefone">
                        Telefone:
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                        placeholder="(00) 00000-0000"
                        title="Formato: (00) 00000-0000"
                        required
                    >
                </fieldset>


                <fieldset>
                    <legend>Endereço</legend>

                    <label for="endereco">
                        Endereço:
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        required
                    >

                    <label for="cidade">
                        Cidade:
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        required
                    >

                    <label for="estado">
                        Estado:
                    </label>

                    <input
                        type="text"
                        id="estado"
                        name="estado"
                        required
                    >

                    <label for="cep">
                        CEP:
                    </label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        pattern="[0-9]{5}-[0-9]{3}"
                        placeholder="00000-000"
                        title="Formato: 00000-000"
                        required
                    >
                </fieldset>


                <div class="alerta alerta-info">
                    Os campos obrigatórios devem ser preenchidos corretamente
                    antes do envio.
                </div>

                <button
                    type="submit"
                    class="botao">
                    Enviar cadastro
                </button>

            </form>
        </section>

    </main>


    <footer>
        <p>
            © 2026 ONG Esperança -
            Todos os direitos reservados.
        </p>
    </footer>


    <script src="js/script.js"></script>

</body>

</html>
